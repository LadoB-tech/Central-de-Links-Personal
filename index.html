<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-sky-500/30">
  <div class="max-w-5xl mx-auto px-4 py-10">
    
    <!-- Encabezado y buscador -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-10 border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Central de Links</h1>
        <p class="text-sm text-slate-400 mt-1">Accesos directos, gestión editorial, INTI y estudio</p>
      </div>
      <div class="relative w-full sm:w-72">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Buscar link o etiqueta..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"
        />
      </div>
    </header>

    <!-- Contenedor de Fijados -->
    <section id="pinnedContainer" class="mb-10 hidden">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="pin" class="w-4 h-4 text-amber-400"></i>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Accesos Fijados</h2>
      </div>
      <div id="pinnedGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- Contenedor Principal de Secciones -->
    <main id="sectionsContainer" class="space-y-10"></main>

    <!-- Mensaje sin resultados -->
    <div id="emptyState" class="hidden text-center py-16 text-slate-500">
      No se encontraron enlaces que coincidan con tu búsqueda.
    </div>

  </div>

  <script>
    const JSON_FILE = 'central-de-links-2026-11-25.json';

    const colorMap = {
      sky: {
        badge: 'bg-sky-500/10 text-sky-400 border-sky-500/20',
        hover: 'hover:border-sky-500/50',
        icon: 'text-sky-400'
      },
      indigo: {
        badge: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20',
        hover: 'hover:border-indigo-500/50',
        icon: 'text-indigo-400'
      },
      emerald: {
        badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
        hover: 'hover:border-emerald-500/50',
        icon: 'text-emerald-400'
      },
      slate: {
        badge: 'bg-slate-500/10 text-slate-300 border-slate-500/20',
        hover: 'hover:border-slate-500/50',
        icon: 'text-slate-300'
      }
    };

    let appData = { sections: [], links: [] };

    function createCard(link, sectionColor) {
      const theme = colorMap[sectionColor] || colorMap.slate;
      const tagsHtml = (link.tags || [])
        .map(tag => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-800/80 text-slate-400">#${tag}</span>`)
        .join('');

      return `
        <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
           class="group flex flex-col justify-between p-4 rounded-2xl bg-slate-900/70 border border-slate-800/90 ${theme.hover} hover:bg-slate-900 transition-all duration-200">
          <div>
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-semibold text-slate-100 group-hover:text-white transition">${link.title}</h3>
              <i data-lucide="external-link" class="w-4 h-4 text-slate-500 group-hover:text-slate-300 shrink-0 mt-0.5 transition"></i>
            </div>
            <p class="text-xs text-slate-400 mt-1.5 line-clamp-2">${link.description || ''}</p>
          </div>
          ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 mt-4 pt-3 border-t border-slate-800/60">${tagsHtml}</div>` : ''}
        </a>
      `;
    }

    function render(filterText = '') {
      const query = filterText.toLowerCase().trim();
      const sectionsContainer = document.getElementById('sectionsContainer');
      const pinnedContainer = document.getElementById('pinnedContainer');
      const pinnedGrid = document.getElementById('pinnedGrid');
      const emptyState = document.getElementById('emptyState');

      sectionsContainer.innerHTML = '';
      pinnedGrid.innerHTML = '';

      const filteredLinks = appData.links.filter(link => {
        if (!query) return true;
        const inTitle = link.title.toLowerCase().includes(query);
        const inDesc = (link.description || '').toLowerCase().includes(query);
        const inTags = (link.tags || []).some(t => t.toLowerCase().includes(query));
        return inTitle || inDesc || inTags;
      });

      if (filteredLinks.length === 0) {
        pinnedContainer.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Renderizar fijados (solo cuando no hay filtro activo)
      const pinnedLinks = filteredLinks.filter(l => l.pinned);
      if (pinnedLinks.length > 0 && !query) {
        pinnedContainer.classList.remove('hidden');
        pinnedGrid.innerHTML = pinnedLinks.map(link => {
          const sec = appData.sections.find(s => s.id === link.sectionId);
          return createCard(link, sec ? sec.color : 'slate');
        }).join('');
      } else {
        pinnedContainer.classList.add('hidden');
      }

      // Renderizar secciones
      appData.sections.forEach(section => {
        const secLinks = filteredLinks.filter(l => l.sectionId === section.id);
        if (secLinks.length === 0) return;

        const theme = colorMap[section.color] || colorMap.slate;
        const sectionEl = document.createElement('section');
        sectionEl.innerHTML = `
          <div class="flex items-center gap-2.5 mb-4">
            <span class="p-1.5 rounded-lg border ${theme.badge}">
              <i data-lucide="${section.icon || 'folder'}" class="w-4 h-4 ${theme.icon}"></i>
            </span>
            <h2 class="text-base font-semibold text-slate-200">${section.name}</h2>
            <span class="text-xs text-slate-500 font-medium">(${secLinks.length})</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${secLinks.map(link => createCard(link, section.color)).join('')}
          </div>
        `;
        sectionsContainer.appendChild(sectionEl);
      });

      lucide.createIcons();
    }

    fetch(JSON_FILE)
      .then(res => res.json())
      .then(data => {
        appData = data;
        render();
      })
      .catch(err => {
        document.getElementById('sectionsContainer').innerHTML = `
          <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
            No se pudo cargar <strong>${JSON_FILE}</strong>. Asegúrate de que ambos archivos estén en la misma carpeta.
          </div>
        `;
      });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      render(e.target.value);
    });
  </script>
</body>
</html>
