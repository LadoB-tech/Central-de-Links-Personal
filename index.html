<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-sky-500/30">
  <div class="max-w-5xl mx-auto px-4 py-10">
    
    <!-- Encabezado y controles -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Central de Links</h1>
        <p class="text-sm text-slate-400 mt-1">Accesos directos, gestión editorial, INTI y estudio</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="relative w-full sm:w-56">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Buscar link o etiqueta..." 
            class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"
          />
        </div>

        <button id="toggleEditBtn" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-200 transition">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          <span id="toggleEditText">Editar</span>
        </button>

        <button id="addSectionBtn" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-100 transition">
          <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i>
          <span>Carpeta</span>
        </button>

        <button id="addLinkBtn" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium bg-sky-600 hover:bg-sky-500 text-white transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Link</span>
        </button>
      </div>
    </header>

    <!-- Barra de herramientas de edición -->
    <div id="editToolbar" class="hidden mb-8 p-4 rounded-2xl bg-slate-900/90 border border-amber-500/30 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-xs text-amber-300">
        <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
        <span>Modo edición: ordena carpetas (↑/↓) o tarjetas (←/→ o arrastrando), y edita nombres o links.</span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="resetBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-red-950/60 hover:text-red-300 text-slate-300 border border-slate-700 transition">
          Restaurar JSON
        </button>
        <button id="exportBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Descargar JSON</span>
        </button>
      </div>
    </div>

    <!-- Contenedor de Fijados -->
    <section id="pinnedContainer" class="mb-10 hidden">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="pin" class="w-4 h-4 text-amber-400"></i>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Accesos Fijados</h2>
      </div>
      <div id="pinnedGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- Contenedor Principal de Carpetas / Secciones -->
    <main id="sectionsContainer" class="space-y-10"></main>

    <!-- Mensaje sin resultados -->
    <div id="emptyState" class="hidden text-center py-16 text-slate-500">
      No se encontraron enlaces que coincidan con tu búsqueda.
    </div>
  </div>

  <!-- Modal para Agregar / Editar Link -->
  <div id="linkModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-white">Nuevo Link</h3>
        <button type="button" onclick="closeLinkModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="linkForm" class="space-y-4">
        <input type="hidden" id="linkId" />
        
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Carpeta</label>
          <select id="linkSection" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500"></select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Título</label>
          <input type="text" id="linkTitle" required placeholder="Ej: Drive Vive CABA" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">URL</label>
          <input type="url" id="linkUrl" required placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Descripción (opcional)</label>
          <input type="text" id="linkDesc" placeholder="Breve detalle del enlace" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Etiquetas separadas por coma (opcional)</label>
          <input type="text" id="linkTags" placeholder="caba, gestión, drive" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500" />
        </div>

        <label class="flex items-center gap-2 cursor-pointer pt-1">
          <input type="checkbox" id="linkPinned" class="rounded bg-slate-950 border-slate-700 text-sky-500 focus:ring-0" />
          <span class="text-sm text-slate-300">Fijar en "Accesos Fijados" arriba</span>
        </label>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeLinkModal()" class="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-800 transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-xl text-sm font-medium bg-sky-600 hover:bg-sky-500 text-white transition">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para Agregar / Editar Carpeta -->
  <div id="sectionModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 id="sectionModalTitle" class="text-lg font-bold text-white">Nueva Carpeta</h3>
        <button type="button" onclick="closeSectionModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="sectionForm" class="space-y-4">
        <input type="hidden" id="sectionId" />
        
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Nombre de la carpeta</label>
          <input type="text" id="sectionName" required placeholder="Ej: Teatro y Prensa, Finanzas, IA..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Color</label>
            <select id="sectionColor" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="sky">Celeste (Sky)</option>
              <option value="indigo">Índigo</option>
              <option value="emerald">Esmeralda</option>
              <option value="amber">Ámbar / Dorado</option>
              <option value="rose">Rosa / Coral</option>
              <option value="violet">Violeta</option>
              <option value="slate">Gris (Slate)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Ícono</label>
            <select id="sectionIcon" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="folder">Carpeta</option>
              <option value="newspaper">Diario / Medios</option>
              <option value="building-2">Edificio / Trabajo</option>
              <option value="graduation-cap">Estudio / Facultad</option>
              <option value="user">Personal</option>
              <option value="sparkles">IA / Herramientas</option>
              <option value="theater">Cultura / Teatro</option>
              <option value="music">Música</option>
              <option value="wallet">Finanzas / Ofertas</option>
              <option value="bookmark">Marcadores</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeSectionModal()" class="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-800 transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-xl text-sm font-medium bg-sky-600 hover:bg-sky-500 text-white transition">Guardar carpeta</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const JSON_FILE = 'central-de-links-2026-11-25.json';
    const STORAGE_KEY = 'central_links_personal_v1';

    const colorMap = {
      sky: { badge: 'bg-sky-500/10 text-sky-400 border-sky-500/20', hover: 'hover:border-sky-500/50', icon: 'text-sky-400' },
      indigo: { badge: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20', hover: 'hover:border-indigo-500/50', icon: 'text-indigo-400' },
      emerald: { badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', hover: 'hover:border-emerald-500/50', icon: 'text-emerald-400' },
      amber: { badge: 'bg-amber-500/10 text-amber-400 border-amber-500/20', hover: 'hover:border-amber-500/50', icon: 'text-amber-400' },
      rose: { badge: 'bg-rose-500/10 text-rose-400 border-rose-500/20', hover: 'hover:border-rose-500/50', icon: 'text-rose-400' },
      violet: { badge: 'bg-violet-500/10 text-violet-400 border-violet-500/20', hover: 'hover:border-violet-500/50', icon: 'text-violet-400' },
      slate: { badge: 'bg-slate-500/10 text-slate-300 border-slate-500/20', hover: 'hover:border-slate-500/50', icon: 'text-slate-300' }
    };

    let appData = { sections: [], links: [] };
    let editMode = false;
    let draggedLinkId = null;

    function saveToLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // --- Gestión de Carpetas ---
    function moveSection(sectionId, direction) {
      const idx = appData.sections.findIndex(s => s.id === sectionId);
      const targetIdx = idx + direction;
      if (idx === -1 || targetIdx < 0 || targetIdx >= appData.sections.length) return;

      const temp = appData.sections[idx];
      appData.sections[idx] = appData.sections[targetIdx];
      appData.sections[targetIdx] = temp;

      saveToLocal();
      render(document.getElementById('searchInput').value);
    }

    function deleteSection(sectionId) {
      const sec = appData.sections.find(s => s.id === sectionId);
      if (!sec) return;
      const count = appData.links.filter(l => l.sectionId === sectionId).length;
      const msg = count > 0
        ? `¿Eliminar la carpeta "${sec.name}" junto con sus ${count} enlaces?`
        : `¿Eliminar la carpeta vacía "${sec.name}"?`;
      
      if (!confirm(msg)) return;
      appData.sections = appData.sections.filter(s => s.id !== sectionId);
      appData.links = appData.links.filter(l => l.sectionId !== sectionId);
      saveToLocal();
      render(document.getElementById('searchInput').value);
    }

    function openSectionModal(section = null) {
      const modal = document.getElementById('sectionModal');
      if (section) {
        document.getElementById('sectionModalTitle').textContent = 'Editar Carpeta';
        document.getElementById('sectionId').value = section.id;
        document.getElementById('sectionName').value = section.name;
        document.getElementById('sectionColor').value = section.color || 'sky';
        document.getElementById('sectionIcon').value = section.icon || 'folder';
      } else {
        document.getElementById('sectionModalTitle').textContent = 'Nueva Carpeta';
        document.getElementById('sectionForm').reset();
        document.getElementById('sectionId').value = '';
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSectionModal() {
      const modal = document.getElementById('sectionModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // --- Gestión de Links ---
    function moveLink(linkId, direction) {
      const idx = appData.links.findIndex(l => l.id === linkId);
      if (idx === -1) return;
      const currentLink = appData.links[idx];
      
      const sameSecIndices = appData.links
        .map((l, i) => l.sectionId === currentLink.sectionId ? i : -1)
        .filter(i => i !== -1);
      
      const posInSec = sameSecIndices.indexOf(idx);
      const targetPosInSec = posInSec + direction;
      if (targetPosInSec < 0 || targetPosInSec >= sameSecIndices.length) return;

      const targetIdx = sameSecIndices[targetPosInSec];
      const temp = appData.links[idx];
      appData.links[idx] = appData.links[targetIdx];
      appData.links[targetIdx] = temp;

      saveToLocal();
      render(document.getElementById('searchInput').value);
    }

    function togglePin(linkId) {
      const link = appData.links.find(l => l.id === linkId);
      if (!link) return;
      link.pinned = !link.pinned;
      saveToLocal();
      render(document.getElementById('searchInput').value);
    }

    function deleteLink(linkId) {
      if (!confirm('¿Eliminar este enlace?')) return;
      appData.links = appData.links.filter(l => l.id !== linkId);
      saveToLocal();
      render(document.getElementById('searchInput').value);
    }

    function openLinkModal(link = null, defaultSectionId = null) {
      if (appData.sections.length === 0) {
        alert('Primero crea al menos una carpeta para guardar el enlace.');
        openSectionModal();
        return;
      }

      const modal = document.getElementById('linkModal');
      const select = document.getElementById('linkSection');
      select.innerHTML = appData.sections.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      if (link) {
        document.getElementById('modalTitle').textContent = 'Editar Link';
        document.getElementById('linkId').value = link.id;
        select.value = link.sectionId;
        document.getElementById('linkTitle').value = link.title;
        document.getElementById('linkUrl').value = link.url;
        document.getElementById('linkDesc').value = link.description || '';
        document.getElementById('linkTags').value = (link.tags || []).join(', ');
        document.getElementById('linkPinned').checked = !!link.pinned;
      } else {
        document.getElementById('modalTitle').textContent = 'Nuevo Link';
        document.getElementById('linkForm').reset();
        document.getElementById('linkId').value = '';
        if (defaultSectionId) select.value = defaultSectionId;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeLinkModal() {
      const modal = document.getElementById('linkModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function createCard(link, sectionColor, isPinnedSection = false) {
      const theme = colorMap[sectionColor] || colorMap.slate;
      const tagsHtml = (link.tags || [])
        .map(tag => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-800/80 text-slate-400">#${tag}</span>`)
        .join('');

      if (!editMode) {
        return `
          <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
             class="group flex flex-col justify-between p-4 rounded-2xl bg-slate-900/70 border border-slate-800/90 ${theme.hover} hover:bg-slate-900 transition-all duration-200">
            <div>
              <div class="flex items-start justify-between gap-2">
                <h3 class="font-semibold text-slate-100 group-hover:text-white transition">${link.title}</h3>
                <i data-lucide="external-link" class="w-4 h-4 text-slate-500 group-hover:text-slate-300 shrink-0 mt-0.5 transition"></i>
              </div>
              <p class="text-xs text-slate-400 mt-1.5 line-clamp-2">${link.description || ''}</p>
            </div>
            ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 mt-4 pt-3 border-t border-slate-800/60">${tagsHtml}</div>` : ''}
          </a>
        `;
      }

      const safeLinkJson = JSON.stringify(link).replace(/'/g, "&#39;");
      return `
        <div draggable="${!isPinnedSection}" data-link-id="${link.id}" data-section-id="${link.sectionId}"
             class="edit-card flex flex-col justify-between p-4 rounded-2xl bg-slate-900 border border-dashed border-slate-700 hover:border-amber-500/50 transition-all">
          <div>
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-semibold text-slate-100">${link.title}</h3>
              <span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">Mover</span>
            </div>
            <p class="text-xs text-slate-400 mt-1 line-clamp-1">${link.url}</p>
          </div>
          
          <div class="flex items-center justify-between gap-1 mt-4 pt-3 border-t border-slate-800">
            <div class="flex items-center gap-1">
              ${!isPinnedSection ? `
                <button onclick="moveLink('${link.id}', -1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" title="Mover antes">
                  <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                </button>
                <button onclick="moveLink('${link.id}', 1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" title="Mover después">
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </button>
              ` : ''}
              <button onclick="togglePin('${link.id}')" class="p-1.5 rounded-lg ${link.pinned ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}" title="Fijar / Desfijar">
                <i data-lucide="pin" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <div class="flex items-center gap-1">
              <button onclick='openLinkModal(${safeLinkJson})' class="p-1.5 rounded-lg bg-sky-500/15 hover:bg-sky-500/30 text-sky-400" title="Editar link">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="deleteLink('${link.id}')" class="p-1.5 rounded-lg bg-red-500/15 hover:bg-red-500/30 text-red-400" title="Eliminar link">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function attachDragEvents() {
      if (!editMode) return;
      document.querySelectorAll('.edit-card[draggable="true"]').forEach(card => {
        card.addEventListener('dragstart', () => {
          draggedLinkId = card.dataset.linkId;
          card.classList.add('opacity-50');
        });
        card.addEventListener('dragend', () => {
          draggedLinkId = null;
          card.classList.remove('opacity-50');
        });
        card.addEventListener('dragover', e => e.preventDefault());
        card.addEventListener('drop', e => {
          e.preventDefault();
          const targetId = card.dataset.linkId;
          if (!draggedLinkId || draggedLinkId === targetId) return;

          const fromIdx = appData.links.findIndex(l => l.id === draggedLinkId);
          const toIdx = appData.links.findIndex(l => l.id === targetId);
          if (fromIdx === -1 || toIdx === -1) return;

          appData.links[fromIdx].sectionId = appData.links[toIdx].sectionId;
          const [movedItem] = appData.links.splice(fromIdx, 1);
          appData.links.splice(toIdx, 0, movedItem);

          saveToLocal();
          render(document.getElementById('searchInput').value);
        });
      });
    }

    function render(filterText = '') {
      const query = filterText.toLowerCase().trim();
      const sectionsContainer = document.getElementById('sectionsContainer');
      const pinnedContainer = document.getElementById('pinnedContainer');
      const pinnedGrid = document.getElementById('pinnedGrid');
      const emptyState = document.getElementById('emptyState');

      sectionsContainer.innerHTML = '';
      pinnedGrid.innerHTML = '';

      const filteredLinks = appData.links.filter(link => {
        if (!query) return true;
        return link.title.toLowerCase().includes(query) ||
               (link.description || '').toLowerCase().includes(query) ||
               (link.tags || []).some(t => t.toLowerCase().includes(query));
      });

      if (filteredLinks.length === 0 && !editMode) {
        pinnedContainer.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      const pinnedLinks = filteredLinks.filter(l => l.pinned);
      if (pinnedLinks.length > 0 && !query) {
        pinnedContainer.classList.remove('hidden');
        pinnedGrid.innerHTML = pinnedLinks.map(link => {
          const sec = appData.sections.find(s => s.id === link.sectionId);
          return createCard(link, sec ? sec.color : 'slate', true);
        }).join('');
      } else {
        pinnedContainer.classList.add('hidden');
      }

      appData.sections.forEach(section => {
        const secLinks = filteredLinks.filter(l => l.sectionId === section.id);
        if (secLinks.length === 0 && !editMode) return;

        const theme = colorMap[section.color] || colorMap.slate;
        const safeSecJson = JSON.stringify(section).replace(/'/g, "&#39;");

        const sectionControls = editMode ? `
          <div class="flex items-center gap-1 ml-auto">
            <button onclick="openLinkModal(null, '${section.id}')" class="flex items-center gap-1 px-2 py-1 rounded-lg text-xs bg-sky-500/15 hover:bg-sky-500/30 text-sky-400 mr-1" title="Agregar link en esta carpeta">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Link</span>
            </button>
            <button onclick="moveSection('${section.id}', -1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" title="Subir carpeta">
              <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="moveSection('${section.id}', 1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" title="Bajar carpeta">
              <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick='openSectionModal(${safeSecJson})' class="p-1.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/30 text-amber-400" title="Renombrar o cambiar color">
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="deleteSection('${section.id}')" class="p-1.5 rounded-lg bg-red-500/15 hover:bg-red-500/30 text-red-400" title="Eliminar carpeta">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        ` : '';

        const emptyFolderHint = (secLinks.length === 0 && editMode)
          ? `<div class="col-span-full p-4 rounded-xl border border-dashed border-slate-800 text-xs text-slate-500 text-center">Carpeta vacía — haz clic en "+ Link" para agregar enlaces aquí.</div>`
          : '';

        const sectionEl = document.createElement('section');
        sectionEl.innerHTML = `
          <div class="flex flex-wrap items-center gap-2.5 mb-4">
            <span class="p-1.5 rounded-lg border ${theme.badge}">
              <i data-lucide="${section.icon || 'folder'}" class="w-4 h-4 ${theme.icon}"></i>
            </span>
            <h2 class="text-base font-semibold text-slate-200">${section.name}</h2>
            <span class="text-xs text-slate-500 font-medium">(${secLinks.length})</span>
            ${sectionControls}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${secLinks.map(link => createCard(link, section.color, false)).join('')}
            ${emptyFolderHint}
          </div>
        `;
        sectionsContainer.appendChild(sectionEl);
      });

      lucide.createIcons();
      attachDragEvents();
    }

    // Eventos principales
    document.getElementById('toggleEditBtn').addEventListener('click', () => {
      editMode = !editMode;
      const toolbar = document.getElementById('editToolbar');
      const btnText = document.getElementById('toggleEditText');
      if (editMode) {
        toolbar.classList.remove('hidden');
        btnText.textContent = 'Listo';
      } else {
        toolbar.classList.add('hidden');
        btnText.textContent = 'Editar';
      }
      render(document.getElementById('searchInput').value);
    });

    document.getElementById('addSectionBtn').addEventListener('click', () => openSectionModal());
    document.getElementById('addLinkBtn').addEventListener('click', () => openLinkModal());

    // Guardar Carpeta
    document.getElementById('sectionForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('sectionId').value;
      const secObj = {
        id: id || 'sec-' + Date.now(),
        name: document.getElementById('sectionName').value.trim(),
        color: document.getElementById('sectionColor').value,
        icon: document.getElementById('sectionIcon').value
      };

      if (id) {
        const idx = appData.sections.findIndex(s => s.id === id);
        if (idx !== -1) appData.sections[idx] = secObj;
      } else {
        appData.sections.push(secObj);
      }

      saveToLocal();
      closeSectionModal();
      render(document.getElementById('searchInput').value);
    });

    // Guardar Link
    document.getElementById('linkForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('linkId').value;
      const tagsRaw = document.getElementById('linkTags').value;
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

      const linkObj = {
        id: id || 'lnk-' + Date.now(),
        sectionId: document.getElementById('linkSection').value,
        title: document.getElementById('linkTitle').value.trim(),
        url: document.getElementById('linkUrl').value.trim(),
        description: document.getElementById('linkDesc').value.trim(),
        tags,
        pinned: document.getElementById('linkPinned').checked
      };

      if (id) {
        const idx = appData.links.findIndex(l => l.id === id);
        if (idx !== -1) appData.links[idx] = linkObj;
      } else {
        appData.links.push(linkObj);
      }

      saveToLocal();
      closeLinkModal();
      render(document.getElementById('searchInput').value);
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = JSON_FILE;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('¿Descartar los cambios locales y volver a cargar el JSON original de GitHub?')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });

    document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      appData = JSON.parse(saved);
      render();
    } else {
      fetch(JSON_FILE)
        .then(res => res.json())
        .then(data => {
          appData = data;
          render();
        })
        .catch(() => {
          document.getElementById('sectionsContainer').innerHTML = `
            <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
              No se pudo cargar <strong>${JSON_FILE}</strong>.
            </div>
          `;
        });
    }
  </script>
</body>
</html>
